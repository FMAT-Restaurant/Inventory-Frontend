name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: inventory
          MONGO_INITDB_ROOT_PASSWORD: inventory_dev
          MONGO_INITDB_DATABASE: inventory
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand({ ping: 1 })' || mongod --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=10s
    steps:
      - name: Checkout Frontend
        uses: actions/checkout@v4

      - name: Checkout Backend
        uses: actions/checkout@v4
        with:
          repository: fmat-restaurant/Inventory-Backend
          ref: main
          path: Inventory-Backend

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Configure Backend .env
        working-directory: Inventory-Backend
        run: |
          cat > .env << 'EOF'
          MONGO_INITDB_ROOT_USERNAME=inventory
          MONGO_INITDB_ROOT_PASSWORD=inventory_dev
          MONGO_INITDB_DATABASE=inventory
          MONGODB_URI=mongodb://inventory:inventory_dev@localhost:27017/inventory?authSource=admin
          PORT=3000
          FRONTEND_URL=http://localhost:5173
          NODE_ENV=qa
          RABBITMQ_URL=amqp://localhost:5672
          EOF

      - name: Install Backend dependencies and build
        working-directory: Inventory-Backend
        run: |
          npm ci
          npm run build

      - name: Start Backend
        working-directory: Inventory-Backend
        run: |
          node dist/main.js &
          echo $! > ../backend.pid
          echo "Backend started"

      - name: Wait for Backend to be ready
        run: |
          for i in {1..60}; do
            if curl -sSf "http://localhost:3000/" >/dev/null 2>&1; then
              echo "Backend is ready"
              exit 0
            fi
            if curl -sSf "http://localhost:3000/ingredients" >/dev/null 2>&1; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend... ($i/60)"
            sleep 2
          done
          echo "Backend failed to start in time"
          exit 1

      - name: Configure Frontend environment
        run: |
          cat > .env << 'EOF'
          VITE_APP_ENV=qa
          VITE_USE_MOCK=false
          VITE_API_URL=http://localhost:3000
          EOF

      - name: Install Frontend dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        env:
          CI: true
        run: npx playwright test

      - name: Stop Backend
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill $(cat backend.pid) 2>/dev/null || true
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
